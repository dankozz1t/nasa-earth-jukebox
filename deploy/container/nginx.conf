# nginx for the single container: runs as uid 1000, writes only to /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /app/www;

        # The host's proxy is the peer. Take the visitor from X-Forwarded-For so the backend
        # rate-limits visitors one by one (same rule as frontend/nginx.conf).
        # 169.254.0.0/16: Cloud Run delivers requests from a link-local address.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 169.254.0.0/16;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # uploads go to the backend, which enforces its own 25 MB limit
        client_max_body_size 26m;

        location /api/ {
            proxy_pass http://127.0.0.1:5080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
