# Docker DNS: re-resolve the backend so a container restart does not leave a stale IP
resolver 127.0.0.11 valid=10s;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a reverse proxy or tunnel the peer is the Docker gateway. Take the client
    # address from X-Forwarded-For so the backend rate-limits visitors one by one.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # uploads go to the backend, which enforces its own 25 MB limit
    client_max_body_size 26m;

    location /api/ {
        # a variable makes nginx resolve the name per request; the URI is passed unchanged
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
